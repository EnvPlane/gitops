name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up module Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Ensure Go toolchain
        run: |
          GO_VERSION_FILE=go.mod \
          ./scripts/ensure-go.sh
      - name: Keep CI on the module Go toolchain
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gitops-go-cache-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gitops-go-cache-${{ runner.os }}-
      - name: Use published contracts module
        run: |
          go mod edit -dropreplace=github.com/envplane/contracts
          go mod tidy
      - name: Scan Go dependencies
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
          repo-checkout: false
      - name: Enforce public module boundary
        run: |
          test -d render
          test -d writer
          test -f docs/module-ownership.md
      - name: Verify public package reachability
        run: ./scripts/check-public-reachability.sh
      - run: go test ./...
      - run: go vet ./...
      - name: Lint Go code
        run: scripts/golangci-lint.sh
      - run: go test -race ./...
      - run: go test -coverprofile=cover.out ./...
      - name: Enforce coverage floor
        run: |
          total="$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/, "", $NF); print $NF}')"
          awk -v total="$total" 'BEGIN { if (total < 20) { print "coverage below 20%: " total "%"; exit 1 } }'
