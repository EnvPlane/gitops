name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Use published contracts module
        run: |
          go mod edit -dropreplace=github.com/envpilot/contracts
          go mod tidy
      - name: Scan Go dependencies
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
          repo-checkout: false
      - name: Enforce public module boundary
        run: |
          test -d render
          test -d writer
          test -f docs/module-ownership.md
      - name: Verify public package reachability
        run: ./scripts/check-public-reachability.sh
      - run: go test ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - run: go test -race ./...
      - run: go test -coverprofile=cover.out ./...
      - name: Enforce coverage floor
        run: |
          total="$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/, "", $NF); print $NF}')"
          awk -v total="$total" 'BEGIN { if (total < 20) { print "coverage below 20%: " total "%"; exit 1 } }'
